[package]
name = "easy-publish-desktop"
version = "0.1.2"
description = "Local article and video publishing workspace"
authors = ["ecojust"]
edition = "2021"
default-run = "easy-publish"

[lib]
name = "easy_publish_desktop"
path = "src/lib.rs"

[[bin]]
name = "easy-publish"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-plugin-dialog", "dep:tauri-build", "dep:tauri-plugin-single-instance"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "rt-multi-thread", "macros"] }
url = "2"
open = "5"
tauri = { version = "2", features = [], optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
