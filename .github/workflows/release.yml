name: Publish verified desktop release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
        default: v0.1.4
      build_run_id:
        description: Successful desktop build run containing all three installers
        required: true
      expected_source_sha:
        description: Exact application source commit used by that build
        required: true

permissions:
  actions: read
  contents: write

concurrency:
  group: desktop-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish existing installers
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check publication guards
        run: python -m unittest discover -s scripts/tests -p 'test_publish_release.py'
      - name: Publish verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
        run: >-
          python scripts/publish-release.py
          --tag "$RELEASE_TAG"
          --build-run-id "$BUILD_RUN_ID"
          --expected-source-sha "$EXPECTED_SOURCE_SHA"
